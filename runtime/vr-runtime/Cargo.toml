[package]
name = "vr-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
xui.workspace = true
vr-dyon.workspace = true
thiserror.workspace = true
# The self-read loader decodes the bundle appended to the executable and reads
# its manifest, so both formats come from their owning crates.
vr-core.workspace = true
vr-pack = { path = "../../crates/vr-pack" }

[build-dependencies]
# Embeds the Common Controls v6 manifest into the test binaries; the hello-window
# sample creates xui controls through Dyon, exactly as vr-dyon's tests do.
embed-resource = "3"

[dev-dependencies]
# Needed to register the recording native in the headless dispatch tests.
dyon.workspace = true
# The hello-window e2e reads the sample manifest and captures the live window.
vr-core.workspace = true
vr-tooling = { path = "../../crates/vr-tooling" }
# The embedded-run e2e builds a bundle to append to a copy of the stub.
vr-pack = { path = "../../crates/vr-pack" }
