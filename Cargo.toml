[workspace]
resolver = "2"
members = [
    "crates/vr-api",
    "crates/vr-core",
    "crates/vr-db",
    "crates/vr-dyon",
    "crates/vr-editor",
    "crates/vr-forms",
    "crates/vr-ide",
    "crates/vr-pack",
    "crates/vr-scintilla",
    "crates/vr-scintilla-sys",
    "crates/vr-std",
    "crates/vr-syntax",
    "crates/vr-tooling",
    "crates/vr-web",
    "runtime/vr-runtime",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/va1erian/visualrust"
rust-version = "1.90"

[workspace.dependencies]
# xui is pre-1.0 and moves quickly: always pin a rev, never a branch.
xui = { git = "https://github.com/va1erian/xui", rev = "ad227ffd9581d0ff87916688b1fb89ca3fccdf83" }
xui-win32 = { git = "https://github.com/va1erian/xui", rev = "ad227ffd9581d0ff87916688b1fb89ca3fccdf83" }
vr-core = { path = "crates/vr-core" }
vr-db = { path = "crates/vr-db" }
vr-dyon = { path = "crates/vr-dyon" }
vr-std = { path = "crates/vr-std" }

# rusqlite's `bundled` feature compiles SQLite from source: no system sqlite3
# needed on end-user machines, matching the self-contained export goal.
rusqlite = { version = "0.40", features = ["bundled"] }

# `http`/`reqwest` are excluded: reqwest 0.9 is unmaintained and unused here.
# `rand` is required because dyon 0.51.3's `threading` code references its `rng` field.
dyon = { version = "0.51.3", default-features = false, features = ["file", "dynload", "stdio", "threading", "rand", "debug_lookup"] }

# Bundle payloads are deflated with flate2's default pure-Rust miniz_oxide
# backend: no C toolchain on the build machine and predictable output. zstd
# compresses better but drags in `zstd-sys` (C), which the export goal avoids.
flate2 = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"

# PE resource patching (#53). `Begin/Update/EndUpdateResourceW` live in
# Win32::System::LibraryLoader; HANDLE/HMODULE and FreeLibrary in
# Win32::Foundation; the version.dll read-back used by vr-pack's test lives in
# Win32::Storage::FileSystem. These are the only namespaces the resource work
# needs, so no `Win32_UI_WindowsAndMessaging` (resource type ids are numeric).
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
] }

# vr-std encoding/hashing deps. base64/percent-encoding cover the encoders,
# regex the pattern commands, and the RustCrypto stack (md-5, sha1, sha2, hmac)
# plus `hex` the digests; all are pure Rust so the Windows build stays clean.
base64 = "0.22"
percent-encoding = "2"
regex = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
