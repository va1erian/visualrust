[workspace]
resolver = "2"
members = [
    "crates/vr-api",
    "crates/vr-core",
    "crates/vr-db",
    "crates/vr-dyon",
    "crates/vr-editor",
    "crates/vr-forms",
    "crates/vr-ide",
    "crates/vr-scintilla",
    "crates/vr-scintilla-sys",
    "crates/vr-std",
    "crates/vr-syntax",
    "crates/vr-tooling",
    "crates/vr-web",
    "runtime/vr-runtime",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/va1erian/visualrust"
rust-version = "1.90"

[workspace.dependencies]
# win32ui is pre-1.0 and moves quickly: always pin a rev, never a branch.
win32ui = { git = "https://github.com/va1erian/win32ui", rev = "01d1778caa5c35edc44dabb8002781670580b17e" }
vr-core = { path = "crates/vr-core" }
vr-dyon = { path = "crates/vr-dyon" }

# `http`/`reqwest` are excluded: reqwest 0.9 is unmaintained and unused here.
# `rand` is required because dyon 0.51.3's `threading` code references its `rng` field.
dyon = { version = "0.51.3", default-features = false, features = ["file", "dynload", "stdio", "threading", "rand", "debug_lookup"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
