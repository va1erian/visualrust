[package]
name = "vr-forms"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `.vrform` (de)serialization and typed errors; pinned via the workspace so every
# crate agrees on one version.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The portable widget layer and its Win32 backend: the designer hosts real xui
# widgets, not hand-drawn stand-ins. Pinned by rev in the workspace.
xui.workspace = true

[dev-dependencies]
# The capture helper the screenshot test drives; only the test needs it.
vr-tooling = { path = "../vr-tooling" }
# Compile-only validation of generated Dyon: the codegen test registers stub
# signatures for the target `ui_*` surface (#136/#137/#138) and loads the
# output, which checks parsing and the lifetime/type checker.
dyon.workspace = true
