[package]
name = "vr-ide"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
# Typed error for the binary's top-level `run`.
thiserror.workspace = true
# The IDE window, its controls and its menus are all xui widgets; workspace pin.
xui.workspace = true
# The editor pane hosts the real Scintilla control through the safe host widget.
vr-scintilla = { path = "../vr-scintilla" }
# The startup document is the entry of the nearest `vrproj.toml`, so the IDE
# reads the manifest rather than re-implementing the project model.
vr-core.workspace = true

[build-dependencies]
# Embeds the Common Controls v6 + DPI manifest into the binary and test
# binaries, the same way xui and vr-dyon do; without it the toolbar and
# status bar (real common-controls children) cannot be created.
embed-resource = "3"

[dev-dependencies]
# The smoke test captures the live shell through the shared harness.
vr-tooling = { path = "../vr-tooling" }
