[package]
name = "vr-dyon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# xui is opt-out so a headless consumer (vr-web) links no windowing code.
default = ["ui"]
ui = ["dep:xui"]

[dependencies]
dyon.workspace = true
thiserror.workspace = true
# The `ui_*` bindings build a xui window entirely from Dyon; workspace pin.
# Optional so `default-features = false` drops xui from the dep graph.
xui = { workspace = true, optional = true }

[build-dependencies]
# Embeds the Common Controls v6 manifest into the test binaries; controls the
# `ui_*` bindings create need it, exactly as xui's own tests do.
embed-resource = "3"

[dev-dependencies]
# The UI smoke test captures the Dyon-built window through the shared harness.
vr-tooling = { path = "../vr-tooling" }
