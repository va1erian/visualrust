[package]
name = "vr-dyon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dyon.workspace = true
thiserror.workspace = true
# The `ui_*` bindings build a win32ui window entirely from Dyon; workspace pin.
win32ui.workspace = true
# The SQLite bindings register their own `*_database` natives from here.
vr-db.workspace = true

[build-dependencies]
# Embeds the Common Controls v6 manifest into the test binaries; controls the
# `ui_*` bindings create need it, exactly as win32ui's own tests do.
embed-resource = "3"

[dev-dependencies]
# The UI smoke test captures the Dyon-built window through the shared harness.
vr-tooling = { path = "../vr-tooling" }
