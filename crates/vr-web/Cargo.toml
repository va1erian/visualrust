[package]
name = "vr-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Typed, `#[from]`-friendly errors with `Display`, per AGENTS.md.
thiserror.workspace = true
# JSON responses need a serialiser; `serde` supplies the `Serialize` bound.
serde.workspace = true
serde_json.workspace = true
# The Dyon binding lives in this crate; it needs Dyon's types and runtime to
# register natives, compile handler modules and call them off-thread.
dyon.workspace = true
# Written out rather than `workspace = true`: Cargo forbids a member from
# turning off the workspace's default features, and `default-features = false`
# is what keeps the xui `ui` bindings out of a headless web server.
vr-dyon = { path = "../vr-dyon", default-features = false }
# Optional so the default web build stays free of bundled SQLite. The `sqlite`
# feature below turns it on and exposes `WebRuntime::start_with_sqlite`, which
# registers `vr-db`'s natives next to the web ones.
vr-db = { path = "../vr-db", optional = true }

[features]
# A web handler wants `open_database` / `database_query`; this pulls `vr-db` in.
sqlite = ["dep:vr-db"]

[dev-dependencies]
# The web-api sample smoke test loads `vrproj.toml` through the shared manifest
# model, so the sample manifest stays the single source of truth for its routes.
vr-core.workspace = true
