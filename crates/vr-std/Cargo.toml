[package]
name = "vr-std"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The stdlib exposes Dyon natives, so it owns their signatures.
dyon.workspace = true
thiserror.workspace = true
# Encoders and digests; kept here rather than in vr-dyon so the runtime stays
# free of the stdlib's dependencies.
base64.workspace = true
percent-encoding.workspace = true
regex.workspace = true
md-5.workspace = true
sha1.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true

[dev-dependencies]
# The end-to-end test drives the natives through the shared runtime; keeping it
# a dev-dependency is what stops vr-std from depending on vr-dyon at runtime.
vr-dyon.workspace = true
