[package]
name = "vr-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Bundled SQLite is the whole point of the crate; see the workspace comment.
rusqlite.workspace = true
thiserror.workspace = true
# The bindings are Dyon natives, so the same crate also owns their signatures.
dyon.workspace = true

[dev-dependencies]
# The end-to-end test runs a Dyon script through the shared runtime.
vr-dyon.workspace = true
# The web+DB bridge test drives the real HTTP server, so `vr-web` is a dev-only
# dependency; enabling its `sqlite` feature does not affect `vr-web`'s own
# default build or `cargo tree -p vr-web -e no-dev`.
vr-web = { path = "../vr-web", features = ["sqlite"] }
