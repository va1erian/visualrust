[package]
name = "vr-scintilla-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Tells Cargo the crate links the native `scintilla` library built by build.rs.
links = "scintilla"

[build-dependencies]
# Compiles the vendored Scintilla C++ sources into a static library.
cc = "1"

[target.'cfg(windows)'.dev-dependencies]
# Only the smoke test creates a real window; the crate API stays raw FFI.
# Same version/features as win32ui so the compiled bindings are shared.
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
