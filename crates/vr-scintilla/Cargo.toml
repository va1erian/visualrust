[package]
name = "vr-scintilla"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The curated raw SCI_* / SCN_* FFI surface; this crate is its safe facade.
vr-scintilla-sys = { path = "../vr-scintilla-sys" }
# The Dyon lexer that drives container-lexer highlighting; no Win32 in it.
vr-syntax = { path = "../vr-syntax" }
# The host widget is a xui `Custom`, so this crate now depends on the widget
# layer for its `Custom`/`Theme`/`Ui` types. Pinned by the workspace rev.
xui.workspace = true
# So the widget can parent Scintilla to a `Custom` HWND and subclass that parent
# to receive `SCN_*`. Features are the exact Win32 namespaces `sys` uses;
# `Win32_UI_Shell` carries `SetWindowSubclass`/`DefSubclassProc`. The version
# unifies with xui's own `windows` dependency.
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Typed errors for window creation and text decoding.
thiserror.workspace = true

[dev-dependencies]
# The integration test builds a real xui window and captures it; both crates
# are already in the dependency graph, listed here so the test can name them.
xui.workspace = true
vr-tooling = { path = "../vr-tooling" }
